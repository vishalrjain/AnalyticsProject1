name: Power BI report validation

on:
  push:
    paths:
      - 'analytics/semantic-model/**'
      - 'analytics/powerbi/reports/**'
      - 'scripts/validation/validate_powerbi_report.py'
      - '.github/workflows/powerbi-report-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powerbi-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validation/validate_powerbi_report.py