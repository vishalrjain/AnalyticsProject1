name: Semantic model validation

on:
  push:
    paths:
      - 'analytics/semantic-model/**'
      - 'analytics/powerbi/reports/**'
      - 'scripts/validation/validate_semantic_model.py'
      - '.github/workflows/semantic-model-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validation/validate_semantic_model.py